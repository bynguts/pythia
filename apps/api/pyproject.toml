[project]
name = "pythia-api"
version = "2.5.0"
description = "Pythia API: waste forecasting, fleet supervision and the city twin for municipal operations"
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt (used by docker and CI);
# development tools in requirements-dev.txt.

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["data", "demo_media"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, import order, bugbear, pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # FastAPI's Depends()/Query() defaults are the framework idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
