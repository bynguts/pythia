<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // #49/#85: install metadata follows the app language. Wave 13: EN is the
      // default (matches documentElement.lang below), ID is opt-in via the
      // language switch persisted as pythia_lang. The href is built from a
      // fixed allowlist (no user input reaches the DOM write), and
      // document.createElement is used instead of document.write/innerHTML.
      // ?lang=en|id on any route wins and is persisted like the language switch.
      (function () {
        var lang = "en";
        var param = null;
        try {
          param = new URLSearchParams(window.location.search).get("lang");
        } catch (e) {
          param = null;
        }
        try {
          if (param === "en" || param === "id") localStorage.setItem("pythia_lang", param);
          lang = localStorage.getItem("pythia_lang") === "id" ? "id" : "en";
        } catch (e) {
          lang = param === "id" ? "id" : "en";
        }
        document.documentElement.lang = lang;
        var link = document.createElement("link");
        link.rel = "manifest";
        // Fixed allowlist: only these two hrefs can ever be assigned.
        link.href = lang === "en" ? "/manifest.webmanifest" : "/manifest.id.webmanifest";
        document.head.appendChild(link);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400..700&family=Geist+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Pythia Command Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
