name: pythia-stack

# One-server deploy: backend (FastAPI), frontend (nginx serving the static build and
# proxying /api), wa-gateway (Baileys). Settings come from deploy/.env (copy
# deploy/.env.example); see deploy/README.md. Images build for the host's
# architecture, so the same file works on amd64 and arm64 servers.
#
# Memory budget (caps), for a server with >= 4 GB:
#   backend     1.5 GB   42 Prophet/XGBoost models (~600 MB warm-up peak) + AI engine
#   frontend    64  MB   nginx serving a static build
#   wa-gateway  384 MB   Baileys WhatsApp session
#   scentinel   1.2 GB   optional profile; the OpenFOAM solve runs in its own container

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        app: ../apps/api
        dataset: ../ml/data
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PYTHIA_ALLOWED_ORIGINS: "${PYTHIA_ALLOWED_ORIGINS:-http://localhost}"
      # Durable stores live on the history volume, not the container's /tmp.
      PYTHIA_DB_PATH: /app/data/history/pythia_history.db
      PYTHIA_DATA_DIR: /data
      PYTHIA_AI_ENGINE: "${PYTHIA_AI_ENGINE:-on}"
      # "Today" and "tomorrow" are Jakarta days, whatever the server's clock zone.
      TZ: "${TZ:-Asia/Jakarta}"
      # The gateway runs in its own container; the API never spawns a local one here.
      OPENWA_BASE_URL: "http://wa-gateway:2785/api"
      PYTHIA_WA_AUTOSTART: "off"
    # Lets OPENAI_BASE_URL point at a gateway on the host: http://host.docker.internal:<port>/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pythia-history:/app/data/history
    mem_limit: 1500m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      # Model warm-up takes ~25 s on a laptop and several times that on a small ARM core.
      start_period: 300s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        app: ../apps/web
      args:
        VITE_PUBLIC_ORIGIN: "${VITE_PUBLIC_ORIGIN:-}"
        VITE_CONTACT_URL: "${VITE_CONTACT_URL:-}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Default 80 for a bare server. Behind a reverse proxy that already owns 80/443
      # (Caddy, nginx), set PYTHIA_HTTP_BIND=127.0.0.1:8080 and proxy to it.
      - "${PYTHIA_HTTP_BIND:-80}:80"
    mem_limit: 64m
    cpus: 0.3

  wa-gateway:
    build:
      context: ./wa-gateway
      dockerfile: Dockerfile
      additional_contexts:
        app: ../apps/wa-gateway
    restart: unless-stopped
    environment:
      # Reachable by the backend on the compose network; no host port is published.
      HOST: "0.0.0.0"
      # Set in deploy/.env to require X-API-Key on every route but /api/health; the
      # backend reads the same variable from .env and sends it.
      OPENWA_API_KEY: "${OPENWA_API_KEY:-}"
    volumes:
      - wa-auth:/app/baileys_auth_info
    mem_limit: 384m
    cpus: 0.3

  # Optional: the Scentinel solver lives in its own repository. Enable with
  #   SCENTINEL_SRC=/path/to/scentinel docker compose --profile scentinel up
  scentinel:
    profiles: ["scentinel"]
    build:
      context: ./scentinel
      dockerfile: Dockerfile
      additional_contexts:
        app: ${SCENTINEL_SRC:-../../scentinel}
    restart: unless-stopped
    environment:
      SCENTINEL_HOME: /data/scentinel-home
    volumes:
      - scentinel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1200m
    cpus: 1.5
    ports:
      - "8090:8090"

networks:
  default:
    driver_opts:
      # A fixed host interface name, so a host firewall rule can let the backend reach a
      # gateway on the host (e.g. iptables -I INPUT -i pythia0 -p tcp --dport <port> -j ACCEPT).
      com.docker.network.bridge.name: pythia0

volumes:
  pythia-history:
  wa-auth:
  scentinel-data:
